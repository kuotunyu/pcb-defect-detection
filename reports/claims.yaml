schema_version: "1.0"
claims:
  paired_protocol:
    status: verified
    statement: >-
      The paired protocol uses a common 30-image final test, shared validation/calibration,
      and exactly class-balanced 513-image training arms that differ only by frozen
      same-board sibling exposure.
    evidence:
      - configs/paired_protocol.yaml
      - reports/protocol/paired_split_manifest.json
      - reports/protocol/paired_split_manifest.sha256
      - reports/protocol/dataset_fingerprint.sha256
    limitations:
      - Structural protocol evidence only; no new model result is implied.

  base_initialization:
    status: verified
    statement: >-
      All paired runs initialize from the same YOLO26n v8.4.0 checkpoint, pinned before training
      by immutable source URL, release revision, byte count, and SHA-256.
    evidence:
      - configs/base_model.yaml
      - src/pcb_defect/experiment.py
      - tests/test_experiment.py
    limitations:
      - The third-party base checkpoint is downloaded at runtime and is not redistributed here.

  paired_leakage_effect:
    status: verified
    statement: >-
      Under the frozen paired protocol, same-board sibling exposure increased three-seed
      final-test mAP50 from 0.6330 to 0.8456, a 21.3 percentage-point difference.
    evidence:
      - reports/protocol/paired_split_manifest.json
      - reports/paired_a100/input_lock.json
      - reports/paired_a100/deployment_selection.json
      - reports/paired_a100/final_metrics.json
      - reports/paired_a100/finalization_record.json
      - reports/paired_a100/result_package_receipt.json
    limitations:
      - The common final test has 30 images from one board; image-bootstrap intervals do not estimate between-board variance.
      - This is a controlled same-board exposure result for this frozen dataset and training recipe, not a universal YOLO performance claim.

  onnx_deployment:
    status: verified_candidate
    statement: >-
      The validation-selected grouped seed-42 checkpoint passed the hash-pinned calibration
      aggregate fidelity gate; the standalone 60/60 gate verifies agreement between two
      execution paths over the same ONNX artifact, not PyTorch-to-ONNX per-box equivalence.
    evidence:
      - reports/paired_a100/input_lock.json
      - reports/paired_a100/deployment_gate.public.json
      - reports/paired_a100/result_package_receipt.json
    limitations:
      - Technical gate passage does not establish redistribution rights for the checkpoint or ONNX file.
      - No public model revision or hosted endpoint is claimed.
      - The later L4 PyTorch-reference strict per-box parity gate failed and is tracked separately.

  tensorrt_performance:
    status: verified_metadata
    statement: >-
      Public, hash-bound metadata derived from a verified private L4 package records PyTorch FP32,
      ONNX Runtime CUDA FP32, and TensorRT FP16 latency on the 60-image calibration split;
      TensorRT FP16 passed the aggregate calibration mAP50-95 fidelity threshold.
    evidence:
      - reports/benchmark_l4.json
      - reports/benchmark_l4_raw.json
    limitations:
      - The source package remains private/unreleased; no checkpoint, ONNX export, engine, or result package is tracked.
      - Timings are calibration-only on the recorded NVIDIA L4 stack and are not a final-test, hosted-demo, or production-SLA claim.
      - One session with interleaved backend execution provides descriptive timing statistics only and does not estimate between-session variance.
      - TensorRT engines are not portable artifacts, and distribution/licensing approval remains unresolved.
      - The first session measured PyTorch FP32 on a 352x640 rectangular letterbox; the corrected re-run in reports/l4_rerun_2abe78fe2b54/ measured all three backends at 640x640, and PyTorch p50 changed by less than 0.2 ms.

  backend_prediction_parity:
    status: failed_gate
    statement: >-
      The frozen strict per-box PyTorch-reference parity gate failed in both L4 sessions on the
      60-image calibration split. The first session's 40/60 failures for both backends came from a
      runner input-geometry defect; in the corrected re-run ONNX Runtime CUDA FP32 passed 60/60
      images, while TensorRT FP16 failed 1/60 on a detection at the confidence threshold.
    evidence:
      - reports/backend_parity_l4.json
      - reports/benchmark_l4.json
      - reports/l4_rerun_2abe78fe2b54/backend_parity_l4.json
      - reports/l4_rerun_2abe78fe2b54/benchmark_l4.json
      - reports/diagnostics/backend_parity_root_cause_2026-09-11.md
    limitations:
      - The gate requires both candidates to pass, so no claim is made that the three backend prediction sets are equivalent.
      - Both sessions are calibration-only diagnostics on one L4 stack, not final-test accuracy evidence.
      - Thresholds were frozen before the first session and were not changed; the runner correction was made after the first session failed and changes only the PyTorch reference input geometry.
      - The TensorRT FP16 sub-threshold score of the single missing detection is not recorded; the threshold-crossing explanation is an inference from its observed FP16 deviation range.

  multi_board_leakage_effect:
    status: pending_colab
    statement: >-
      A leave-one-board-out replication of the paired protocol is pre-registered: six held-out
      boards (05, 07, 08, 09, 11, 12) under one eligibility rule, the same recipe, seeds, and
      evaluator, with the per-board leaky-minus-grouped mAP50 delta as the primary endpoint.
      Board 08 reuses its published evidence; the other five folds have not been run yet.
    evidence:
      - docs/lobo-preregistration.md
      - configs/lobo/folds.yaml
    limitations:
      - No multi-board result exists yet; nothing beyond the single-board finding is claimed.
      - Boards 01, 04, 06, and 10 are never held out, so the design covers the 60-image boards only.
      - With six boards the board-level bootstrap interval will be approximate.

  hosted_demo:
    status: out_of_scope
    statement: Hosted inference is intentionally excluded from this published metadata-only portfolio release.
    evidence:
      - app/model_contract.json
    limitations:
      - Hosted inference is out of scope; no release-approved public artifact or immutable hosted revision is configured.

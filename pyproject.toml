[project]
name = "pcb-defect"
version = "0.1.0"
description = "PCB bare-board defect detection with Ultralytics YOLO26 (HRIPCB) - AOI portfolio project"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "kuotunyu" }]
keywords = [
    "computer vision",
    "industrial AI",
    "machine learning",
    "model evaluation",
    "object detection",
    "PCB defect detection",
]
dependencies = [
    "kagglehub>=0.3",
    "pillow>=10",
    "pyyaml>=6",
]

[project.optional-dependencies]
app = [
    "gradio==6.19.0",
    "huggingface-hub==1.22.0",
    "numpy==2.4.6",
    "onnxruntime==1.26.0; sys_platform == 'win32'",
    "onnxruntime==1.27.0; sys_platform == 'linux'",
    "opencv-python-headless==4.13.0.92",
    "pillow==12.3.0",
]
train = [
    "ultralytics==8.4.89",
    "torch>=2.4",
    "torchvision",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "numpy>=1.26",
]
eval = [
    "onnx>=1.16",
    # ORT 1.27 PyPI GPU wheels target CUDA 13. Colab A100/L4 currently uses
    # CUDA 12.6, so keep CPU/GPU evaluation on the CUDA-12-compatible 1.26 line.
    "onnxruntime==1.26.0; sys_platform == 'win32'",
    "onnxruntime-gpu==1.26.0; sys_platform == 'linux'",
    "onnxslim>=0.1",
    # opencv: NOT added explicitly here - ultralytics ([train] extra) already pulls in
    # opencv-python transitively, and adding opencv-python-headless alongside it would
    # conflict (both packages own the same cv2 import namespace). The cv2 evaluation path is
    # exercised with [train], whose Ultralytics dependency provides opencv-python.
]
l4 = [
    "tensorrt-cu12==10.13.3.9; sys_platform == 'linux'",
]

[project.urls]
Repository = "https://github.com/kuotunyu/pcb-defect-detection"
Issues = "https://github.com/kuotunyu/pcb-defect-detection/issues"

[tool.uv]
# cu126 index has no macOS wheels; lock only for the platforms we actually use.
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
# uv's default directory cache key only watches build metadata. Track every local
# wheel input so a non-editable sync cannot reuse a wheel built from stale source.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "README.md" },
    { file = "LICENSE" },
    { file = "src/**/*.py" },
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcb_defect"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests/fixtures"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Colab notebooks legitimately break "imports at top of file": installs must
# run (and packages import-check) before the import that needs them.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
